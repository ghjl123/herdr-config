onboarding = false

[ui]
status_indicators = "symbols"
# Right-click pastes: Windows Terminal handles the mouse, not herdr (no pane menu).
mouse_capture = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
switch_workspace = "alt+1..9"
next_workspace = "alt+down"
previous_workspace = "alt+up"

[ui.sidebar.spaces]
rows = [["state_icon", "$index", "workspace"], ["branch", "git_status"]]
