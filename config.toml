onboarding = false

[ui]
status_indicators = "symbols"

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
switch_workspace = "ctrl+1..9"
next_workspace = "ctrl+tab"
previous_workspace = "ctrl+shift+tab"

[ui.sidebar.spaces]
rows = [["state_icon", "$index", "workspace"], ["branch", "git_status"]]
