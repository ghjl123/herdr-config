onboarding = false

[ui]
status_indicators = "symbols"
# herdr handles the mouse (click a space to open it). It has no right-click paste:
# Shift+right-click goes to Windows Terminal, which pastes; Ctrl+V pastes too.
mouse_capture = true

[ui.sound]
enabled = false

[ui.toast]
delivery = "system"

[keys]
switch_workspace = "alt+1..9"
next_workspace = "alt+down"
previous_workspace = "alt+up"
# Closes the current space (asks first: ui.confirm_close). Ctrl+W no longer reaches the pane (bash delete-word).
close_workspace = ["prefix+shift+d", "ctrl+w", "alt+w"]

[ui.sidebar.spaces]
rows = [["state_icon", "$index", "workspace"], ["branch", "git_status"]]
